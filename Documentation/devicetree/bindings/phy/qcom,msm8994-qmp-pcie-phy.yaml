%YAML 1.2
---
$id: http://devicetree.org/schemas/phy/qcom,msm8994-qmp-pcie-phy.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Qualcomm MSM8994 20nm QMP PCIe PHY

maintainers:
  - Bjorn Andersson <andersson@kernel.org>

description:
  Per-port 20nm QMP PCIe PHY on MSM8994 (and MSM8992 RC0). One 4 KiB
  register block per root complex. Do not use the MSM8996 shared
  wrapper compatible.

properties:
  compatible:
    const: qcom,msm8994-qmp-pcie-phy

  reg:
    maxItems: 1

  clocks:
    maxItems: 3

  clock-names:
    items:
      - const: ref
      - const: ldo
      - const: pipe

  resets:
    maxItems: 1

  reset-names:
    items:
      - const: phy

  vdda-supply:
    description: Analog 1.8 V (3.10 vreg-1.8, PM8994 L12)

  "#clock-cells":
    const: 0

  clock-output-names:
    maxItems: 1

  "#phy-cells":
    const: 0

required:
  - compatible
  - reg
  - clocks
  - clock-names
  - resets
  - reset-names
  - "#clock-cells"
  - clock-output-names
  - "#phy-cells"

additionalProperties: false

examples:
  - |
    #include <dt-bindings/clock/qcom,gcc-msm8994.h>
    #include <dt-bindings/clock/qcom,rpmcc.h>

    phy@fc52e000 {
        compatible = "qcom,msm8994-qmp-pcie-phy";
        reg = <0xfc52e000 0x1000>;

        clocks = <&rpmcc RPM_SMD_LN_BB_CLK>,
                 <&gcc PCIE_1_PHY_LDO>,
                 <&gcc GCC_PCIE_1_PIPE_CLK>;
        clock-names = "ref", "ldo", "pipe";

        resets = <&gcc PCIE_PHY_1_RESET>;
        reset-names = "phy";

        #clock-cells = <0>;
        clock-output-names = "pcie_1_pipe";
        #phy-cells = <0>;
    };
